<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Love</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
        :root{
            --primary:#10B981;           /* Emerald Green */
            --primary-dark:#059669;      /* Dark Emerald */
            --secondary:#34D399;         /* Lime Green Accent */
            --sidebar:#ECFDF5;           /* Soft Mint */
            --sent:#10B981;              /* Sent messages */
            --received:#FFFFFF;          /* Received */
            --text:#1F2937;              /* Dark gray text */
            --light:#6B7280;             /* Light text */
            --border:#A7F3D0;            /* Light green border */
            --online:#34D399;            /* Online dot */
            --card:#FFFFFF;
            --card-hover:#F0FDF4;
            --card-active:#DCFCE7;
            --mango-gradient: linear-gradient(135deg, #FFD700, #FFA500);
        }
        body{
            background:linear-gradient(135deg, var(--primary), var(--primary-dark));
            height:100vh;display:flex;justify-content:center;align-items:center;
            padding:10px;overflow:hidden;position:relative;
        }
        .container{
            width:100%;max-width:1400px;height:95vh;background:#fff;
            border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);
            display:flex;overflow:hidden;display:none;z-index:10;position:relative;
        }

        /* ---------- SIDEBAR ---------- */
        .sidebar{width:30%;min-width:300px;background:var(--sidebar);
                 border-right:1px solid var(--border);display:flex;flex-direction:column;}
        .profile-header{background:var(--primary-dark);color:#fff;padding:15px;
                        display:flex;align-items:center;gap:12px;border-radius:12px 12px 0 0;}
        .profile-pic{width:45px;height:45px;border-radius:50%;background:#ddd;
                     display:flex;align-items:center;justify-content:center;
                     cursor:pointer;border:3px solid #fff;overflow:hidden;}
        .profile-pic img{width:100%;height:100%;object-fit:cover;}
        .profile-pic .default-avatar{font-size:20px;color:#666;}
        .profile-info{flex:1;}
        .profile-name{font-weight:600;font-size:16px;}
        .profile-status{font-size:12px;opacity:.9;}
        .header-icons{display:flex;gap:15px;}
        .icon{cursor:pointer;font-size:18px;color:#fff;}

        .chat-list{flex:1;overflow-y:auto;padding:10px 0;}
        .chat-item{display:flex;padding:15px;border-bottom:1px solid var(--border);
                   cursor:pointer;gap:12px;align-items:center;transition:.2s;}
        .chat-item:hover{background:var(--card-hover);}
        .chat-item.active{background:var(--card-active);border-left:4px solid var(--primary);}
        .chat-avatar{width:50px;height:50px;border-radius:50%;background:#ddd;
                     display:flex;align-items:center;justify-content:center;
                     position:relative;overflow:hidden;}
        .chat-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
        .chat-avatar .default-avatar{font-size:18px;color:#666;}
        .online-indicator{position:absolute;bottom:2px;right:2px;width:12px;height:12px;
                          background:var(--online);border-radius:50%;border:2px solid #fff;}
        .chat-details{flex:1;}
        .chat-name{font-weight:600;margin-bottom:4px;font-size:15px;color:var(--text);}
        .chat-preview{font-size:13px;color:var(--light);white-space:nowrap;
                      overflow:hidden;text-overflow:ellipsis;}
        .chat-meta{text-align:right;}
        .chat-time{font-size:11px;color:var(--light);margin-bottom:4px;}

        /* ---------- CHAT AREA ---------- */
        .chat-area{flex:1;display:flex;flex-direction:column;background:#FAFDF9;position:relative;}
        .chat-header{background:var(--sidebar);padding:15px 20px;
                     display:flex;align-items:center;justify-content:space-between;
                     border-bottom:1px solid var(--border);}
        .chat-header-info{display:flex;align-items:center;gap:12px;}
        .chat-header-avatar{width:45px;height:45px;border-radius:50%;background:#ddd;
                            display:flex;align-items:center;justify-content:center;
                            position:relative;overflow:hidden;}
        .chat-header-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
        .chat-header-avatar .default-avatar{font-size:18px;color:#666;}
        .chat-header-name{font-weight:600;font-size:16px;color:var(--text);}
        .chat-header-status{font-size:13px;color:var(--light);}
        .chat-header-actions{display:flex;gap:20px;}
        .chat-header-actions i{cursor:pointer;font-size:20px;color:var(--primary);}

        .messages-container{flex:1;padding:20px;overflow-y:auto;
                            display:flex;flex-direction:column;gap:10px;}
        .message{max-width:70%;padding:11px 16px;border-radius:12px;position:relative;
                 word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,.05);}
        .message-sent{align-self:flex-end;background:var(--sent);color:#fff;
                      border-bottom-right-radius:4px;}
        .message-received{align-self:flex-start;background:var(--received);color:var(--text);
                          border-bottom-left-radius:4px;border:1px solid #E5E7EB;}
        .message-system{align-self:center;background:var(--card-active);color:var(--text);
                        font-size:13px;padding:8px 16px;border-radius:12px;}
        .message-time{font-size:11px;opacity:.8;margin-top:4px;text-align:right;}

        /* ---------- INPUT BAR - 100% VISIBLE & FIXED ---------- */
        .message-input-container{
            padding:14px 18px;
            background:var(--sidebar);
            display:flex;
            align-items:center;
            gap:12px;
            border-top:1px solid var(--border);
            min-height:68px;
            z-index:100;
            position:relative;
            width:100%;
        }
        .input-actions{
            display:flex;
            gap:14px;
            align-items:center;
        }
        .input-actions i{
            cursor:pointer;
            font-size:23px;
            color:var(--primary);
            transition:.2s;
        }
        .input-actions i:hover{transform:scale(1.15);}
        .message-input{
            flex:1;
            border:none;
            border-radius:26px;
            padding:12px 20px;
            outline:none;
            font-size:15.5px;
            background:#fff;
            box-shadow:0 2px 5px rgba(0,0,0,.08);
            min-height:48px;
            resize:none;
        }
        .send-button{
            background:var(--primary);
            color:#fff;
            border:none;
            width:50px;
            height:50px;
            border-radius:50%;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            flex-shrink:0;
            box-shadow:0 3px 8px rgba(16,185,129,.35);
            transition:.2s;
        }
        .send-button:hover{background:var(--primary-dark);transform:scale(1.08);}

        /* ---------- LOGIN SCREEN ---------- */
        .login-screen{position:absolute;top:0;left:0;right:0;bottom:0;
                      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
                      display:flex;justify-content:center;align-items:center;z-index:2000;}
        .login-container{background:#fff;border-radius:16px;padding:40px;
                         width:90%;max-width:420px;text-align:center;
                         box-shadow:0 15px 35px rgba(0,0,0,.2);}
        .login-title{
            background: var(--mango-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .login-subtitle{color:var(--light);margin-bottom:30px;font-size:16px;}

        .user-selection{display:flex;flex-direction:column;gap:16px;margin-bottom:24px;}
        .user-card{background:var(--card);border:2px solid var(--border);
                   border-radius:14px;padding:18px;display:flex;align-items:center;
                   gap:16px;cursor:pointer;transition:all .25s ease;
                   box-shadow:0 3px 10px rgba(0,0,0,.08);}
        .user-card:hover{border-color:var(--primary);background:var(--card-hover);
                         transform:translateY(-3px);box-shadow:0 6px 16px rgba(16,185,129,.15);}
        .user-card.active{border-color:var(--primary);background:var(--card-active);
                          font-weight:600;box-shadow:0 6px 16px rgba(16,185,129,.2);}
        .user-card .avatar{
            width:52px;height:52px;border-radius:50%;
            background: var(--mango-gradient);
            display:flex;align-items:center;justify-content:center;
            font-size:21px;color:#fff;font-weight:bold;
        }
        .user-card .name{font-size:18px;color:var(--text);}

        .login-button{background:var(--primary);color:#fff;border:none;
                      border-radius:28px;padding:15px 32px;font-size:17px;
                      cursor:pointer;width:100%;font-weight:600;transition:.25s;
                      box-shadow:0 4px 12px rgba(16,185,129,.3);}
        .login-button:hover{background:var(--primary-dark);transform:translateY(-1px);}
        .login-button:disabled{background:#9CA3AF;cursor:not-allowed;transform:none;}

        .connection-status{position:fixed;top:15px;right:15px;background:rgba(0,0,0,.8);
                           color:#fff;padding:8px 16px;border-radius:20px;
                           font-size:14px;z-index:1000;display:flex;align-items:center;gap:6px;}
        .connection-status.connected{background:var(--secondary);color:#fff;}

        /* ---------- CALL SCREEN - NO ECHO ---------- */
        .call-screen{
            position:fixed;top:0;left:0;right:0;bottom:0;
            background:#000;color:#fff;
            display:none;flex-direction:column;justify-content:space-between;
            align-items:center;padding:20px;z-index:3000;
        }
        .caller-info{flex:1;display:flex;flex-direction:column;
                     justify-content:center;align-items:center;gap:16px;
                     text-align:center;width:100%;}
        .caller-avatar{width:90px;height:90px;border-radius:50%;
                       background:#333;display:flex;align-items:center;
                       justify-content:center;overflow:hidden;border:4px solid #fff;}
        .caller-avatar img{width:100%;height:100%;object-fit:cover;}
        .caller-name{font-size:24px;font-weight:600;}
        .call-status{font-size:18px;color:var(--secondary);}

        .video-container{
            width:100%;max-width:400px;height:50vh;
            background:#000;border-radius:14px;overflow:hidden;
            margin:20px 0;position:relative;display:none;
            box-shadow:0 8px 25px rgba(0,0,0,.4);
        }
        .remote-video{width:100%;height:100%;object-fit:cover;}
        .local-video{
            position:absolute;bottom:15px;right:15px;
            width:100px;height:140px;border-radius:10px;
            border:3px solid #fff;overflow:hidden;z-index:10;
            object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.3);
        }

        .call-controls{
            display:flex;gap:30px;justify-content:center;width:100%;
        }
        .call-button{
            width:70px;height:70px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            font-size:28px;cursor:pointer;transition:0.25s;
            box-shadow:0 6px 16px rgba(0,0,0,.3);
        }
        .accept-call{background:var(--secondary);color:#fff;}
        .reject-call{background:#EF4444;color:#fff;}
        .end-call{background:#EF4444;color:#fff;display:none;}

        @media (max-width:768px){
            .container{flex-direction:column;height:100vh;border-radius:0;}
            .sidebar{width:100%;height:30%;min-width:auto;}
            .chat-area{width:100%;height:70%;}
            .message-input-container{padding:12px 14px;gap:10px;}
            .message-input{font-size:15px;padding:10px 16px;}
            .send-button{width:46px;height:46px;font-size:18px;}
            .input-actions i{font-size:21px;}
            .call-button{width:65px;height:65px;font-size:26px;}
            .local-video{width:80px;height:110px;bottom:10px;right:10px;}
            .login-container{padding:30px;}
            .login-title{font-size:34px;}
        }
    </style>
</head>
<body>

    <div class="connection-status" id="connectionStatus">
        Connecting...
    </div>

    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h2 class="login-title">Mango Love</h2>
            <p class="login-subtitle">Select your baby to start loving</p>

            <div class="user-selection">
                <div class="user-card" data-user="mango1">
                    <div class="avatar">1</div>
                    <div class="name">Mango 1</div>
                </div>
                <div class="user-card" data-user="mango2">
                    <div class="avatar">2</div>
                    <div class="name">Mango 2</div>
                </div>
            </div>

            <button class="login-button" id="loginButton" disabled>Start Loving</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="container" id="mainContainer">
        <div class="sidebar">
            <div class="profile-header">
                <div class="profile-pic" id="userProfilePic">
                    <div class="default-avatar"><i class="fas fa-user"></i></div>
                </div>
                <div class="profile-info">
                    <div class="profile-name" id="userName">User</div>
                    <div class="profile-status" id="userStatus">Offline</div>
                </div>
                <div class="header-icons">
                    <div class="icon"><i class="fas fa-circle-notch"></i></div>
                    <div class="icon"><i class="fas fa-comment-alt"></i></div>
                </div>
            </div>

            <div class="chat-list">
                <div class="chat-item active">
                    <div class="chat-avatar">
                        <div class="default-avatar"><i class="fas fa-user"></i></div>
                        <div class="online-indicator" id="onlineIndicator" style="display:none;"></div>
                    </div>
                    <div class="chat-details">
                        <div class="chat-name" id="contactName">Your Love</div>
                        <div class="chat-preview" id="chatPreview">Start loving...</div>
                    </div>
                    <div class="chat-meta"><div class="chat-time">Now</div></div>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-header-avatar">
                        <div class="default-avatar"><i class="fas fa-user"></i></div>
                        <div class="online-indicator" id="chatOnlineIndicator" style="display:none;"></div>
                    </div>
                    <div>
                        <div class="chat-header-name" id="chatContactName">Your Love</div>
                        <div class="chat-header-status" id="chatContactStatus">Offline</div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <i class="fas fa-phone-alt icon" id="voiceCallBtn" title="Voice Call"></i>
                    <i class="fas fa-video icon" id="videoCallBtn" title="Video Call"></i>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="message message-system">
                    Welcome to Mango Love! Start loving...
                </div>
            </div>

            <!-- INPUT BAR - 100% VISIBLE -->
            <div class="message-input-container">
                <div class="input-actions">
                    <i class="fas fa-smile"></i>
                    <i class="fas fa-paperclip" id="attachButton"></i>
                </div>
                <input type="text" class="message-input" placeholder="Type a message..." id="messageInput">
                <button class="send-button" id="sendButton">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- CALL SCREEN -->
    <div class="call-screen" id="callScreen">
        <div class="caller-info">
            <div class="caller-avatar">
                <div class="default-avatar"><i class="fas fa-user"></i></div>
            </div>
            <div class="caller-name" id="callerName">Your Love</div>
            <div class="call-status" id="callStatus">Calling...</div>

            <div class="video-container" id="videoContainer">
                <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
                <video id="localVideo" class="local-video" autoplay playsinline></video>
            </div>
        </div>

        <div class="call-controls">
            <div class="call-button accept-call" id="acceptCall"><i class="fas fa-phone"></i></div>
            <div class="call-button reject-call" id="rejectCall"><i class="fas fa-phone-slash"></i></div>
        </div>
        <div class="call-button end-call" id="endCall"><i class="fas fa-phone-slash"></i></div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none;">

    <script>
        // ---------- GLOBALS ----------
        let socket, currentUser = '', otherUser = '', localStream, remoteStream,
            peerConnection, isCallActive = false, currentCallType = '', callEnded = false;

        // ---------- DOM ----------
        const loginScreen   = document.getElementById('loginScreen');
        const mainContainer = document.getElementById('mainContainer');
        const loginButton   = document.getElementById('loginButton');
        const userCards     = document.querySelectorAll('.user-card');
        const messageInput  = document.getElementById('messageInput');
        const sendButton    = document.getElementById('sendButton');
        const messagesContainer = document.getElementById('messagesContainer');
        const voiceCallBtn  = document.getElementById('voiceCallBtn');
        const videoCallBtn  = document.getElementById('videoCallBtn');
        const attachButton  = document.getElementById('attachButton');
        const callScreen    = document.getElementById('callScreen');
        const callStatus    = document.getElementById('callStatus');
        const acceptCall    = document.getElementById('acceptCall');
        const rejectCall    = document.getElementById('rejectCall');
        const endCall       = document.getElementById('endCall');
        const videoContainer = document.getElementById('videoContainer');
        const remoteVideo   = document.getElementById('remoteVideo');
        const localVideo    = document.getElementById('localVideo');
        const userProfilePic= document.getElementById('userProfilePic');
        const fileInput     = document.getElementById('fileInput');

        // ---------- LOGIN ----------
        let selectedUser = null;
        userCards.forEach(card => {
            card.addEventListener('click', () => {
                userCards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                selectedUser = card.dataset.user;
                loginButton.disabled = false;
            });
        });

        loginButton.addEventListener('click', () => {
            if (!selectedUser) return;
            currentUser = selectedUser;
            otherUser   = currentUser === 'mango1' ? 'mango2' : 'mango1';

            document.getElementById('userName').textContent        = currentUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('contactName').textContent     = otherUser   === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('chatContactName').textContent = otherUser   === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('callerName').textContent      = otherUser   === 'mango1' ? 'Mango 1' : 'Mango 2';

            loginScreen.style.display   = 'none';
            mainContainer.style.display = 'flex';

            initializeSocket();
            loadProfilePictures();
        });

        // ---------- PROFILE PIC ----------
        userProfilePic.addEventListener('click', () => fileInput.click());
        fileInput.onchange = e => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = `<img src="${ev.target.result}">`;
                    document.querySelectorAll('.profile-pic, .caller-avatar').forEach(p => p.innerHTML = img);
                    localStorage.setItem('profilePic', ev.target.result);
                };
                reader.readAsDataURL(file);
            }
        };
        function loadProfilePictures() {
            const pic = localStorage.getItem('profilePic');
            if (pic) document.querySelectorAll('.profile-pic, .caller-avatar').forEach(p => p.innerHTML = `<img src="${pic}">`);
        }

        // ---------- FILE ATTACH ----------
        attachButton.addEventListener('click', () => fileInput.click());

        // ---------- SOCKET ----------
        function initializeSocket() {
            socket = io();

            socket.on('connect', () => {
                document.getElementById('connectionStatus').innerHTML = 'Connected';
                document.getElementById('connectionStatus').classList.add('connected');
                socket.emit('user-login', { username: currentUser });
            });

            socket.on('disconnect', () => {
                document.getElementById('connectionStatus').innerHTML = 'Disconnected';
                document.getElementById('connectionStatus').classList.remove('connected');
            });

            socket.on('user-online', d => { if (d.username === otherUser) updateUserStatus(true); });
            socket.on('user-offline', d => { if (d.username === otherUser) updateUserStatus(false); });

            socket.on('new-message', m => {
                if (m.sender === otherUser) addMessage('received', m.text, new Date(m.timestamp));
            });

            // CALL EVENTS
            socket.on('incoming-call', async data => {
                if (isCallActive || callEnded) return;
                currentCallType = data.callType;
                callStatus.textContent = `Incoming ${currentCallType} call...`;
                callScreen.style.display = 'flex';
                videoContainer.style.display = currentCallType === 'video' ? 'block' : 'none';
                createPeerConnection();
                if (data.offer) await peerConnection.setRemoteDescription(data.offer);
            });

            socket.on('call-accepted', async data => {
                if (peerConnection && data.answer) {
                    await peerConnection.setRemoteDescription(data.answer);
                    startCall();
                }
            });

            socket.on('call-rejected', () => { if (!callEnded) endCallHandler('Call rejected'); });
            socket.on('call-ended', () => { if (!callEnded) { callEnded = true; endCallHandler('Call ended'); } });
            socket.on('ice-candidate', async c => { if (peerConnection) await peerConnection.addIceCandidate(c); });
        }

        function updateUserStatus(online) {
            const txt = online ? 'Online' : 'Offline';
            const dsp = online ? 'block' : 'none';
            document.getElementById('userStatus').textContent = txt;
            document.getElementById('chatContactStatus').textContent = txt;
            document.getElementById('onlineIndicator').style.display = dsp;
            document.getElementById('chatOnlineIndicator').style.display = dsp;
        }

        // ---------- MESSAGING ----------
        function sendMessage() {
            const txt = messageInput.value.trim();
            if (!txt || !socket) return;
            const payload = { text: txt, sender: currentUser, receiver: otherUser, timestamp: Date.now() };
            socket.emit('send-message', payload);
            addMessage('sent', txt, new Date());
            messageInput.value = '';
        }
        function addMessage(type, text, time) {
            const div = document.createElement('div');
            div.className = `message message-${type}`;
            const t = time.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            div.innerHTML = `<div>${text}</div><div class="message-time">${t}</div>`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', e => e.key === 'Enter' && sendMessage());

        // ---------- CALL BUTTONS ----------
        voiceCallBtn.addEventListener('click', () => initiateCall('voice'));
        videoCallBtn.addEventListener('click', () => initiateCall('video'));
        acceptCall.addEventListener('click', acceptIncomingCall);
        rejectCall.addEventListener('click', rejectIncomingCall);
        endCall.addEventListener('click', () => endCallHandler('ended'));

        // ---------- WEBRTC - NO ECHO ----------
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);

            if (localStream) {
                localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                // Mute local video audio output only
                localVideo.srcObject = localStream;
                localVideo.muted = true;
            }

            peerConnection.ontrack = e => {
                remoteStream = e.streams[0];
                remoteVideo.srcObject = remoteStream;
            };

            peerConnection.onicecandidate = ev => {
                if (ev.candidate && socket && socket.connected) {
                    socket.emit('ice-candidate', { target: otherUser, candidate: ev.candidate });
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'failed' && !callEnded) {
                    endCallHandler('Connection failed');
                }
            };
        }

        async function initiateCall(callType) {
            if (!socket.connected) return alert('Not connected');
            currentCallType = callType; callEnded = false;
            try {
                const constraints = { 
                    audio: { echoCancellation: true, noiseSuppression: true }, 
                    video: callType === 'video' 
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                localVideo.muted = true; // Prevent echo
                createPeerConnection();
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('call-user', { target: otherUser, from: currentUser, offer, callType });
                callStatus.textContent = 'Calling...';
                callScreen.style.display = 'flex';
                videoContainer.style.display = callType === 'video' ? 'block' : 'none';
            } catch (e) { alert(`Failed to start ${callType} call: ${e.message}`); }
        }

        async function acceptIncomingCall() {
            try {
                const constraints = { 
                    audio: { echoCancellation: true, noiseSuppression: true }, 
                    video: currentCallType === 'video' 
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                localVideo.muted = true; // Critical: Prevents echo
                localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('accept-call', { from: otherUser, answer });
                startCall();
            } catch (e) { endCallHandler('Failed to accept call'); }
        }

        function rejectIncomingCall() {
            socket.emit('reject-call', { from: otherUser });
            endCallHandler('Call rejected');
        }

        function startCall() {
            isCallActive = true; callEnded = false;
            callStatus.textContent = `${currentCallType} call connected`;
            acceptCall.style.display = 'none';
            rejectCall.style.display = 'none';
            endCall.style.display = 'flex';
        }

        function endCallHandler(reason) {
            if (callEnded) return;
            callEnded = true; isCallActive = false;
            callScreen.style.display = 'none';
            videoContainer.style.display = 'none';
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (socket && socket.connected && reason !== 'Call ended' && reason !== 'Call rejected') {
                socket.emit('end-call', { target: otherUser });
            }
            if (reason && !reason.includes('Failed')) {
                addMessage('system', `${currentCallType} call ${reason}`, new Date());
            }
        }
    </script>
</body>
