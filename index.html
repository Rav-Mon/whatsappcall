<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Love</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        :root {
            --primary-color: #0084FF;
            --primary-dark: #0066CC;
            --secondary-color: #00D4AA;
            --sidebar-bg: #F0F2F5;
            --message-sent: #0084FF;
            --message-received: #FFFFFF;
            --text-color: #303030;
            --light-text: #667781;
            --border-color: #e0e0e0;
            --online-indicator: #00D4AA;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            height: 95vh;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 30%;
            min-width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .profile-header {
            background: var(--primary-dark);
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid white;
            overflow: hidden;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic .default-avatar {
            font-size: 20px;
            color: #666;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-weight: 600;
            font-size: 16px;
        }

        .profile-status {
            font-size: 12px;
            opacity: 0.9;
        }

        .header-icons {
            display: flex;
            gap: 15px;
        }

        .icon {
            cursor: pointer;
            font-size: 18px;
            color: white;
        }

        /* REMOVED SEARCH CONTAINER */

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chat-item {
            display: flex;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            gap: 12px;
            align-items: center;
        }

        .chat-item:hover {
            background: rgba(0,0,0,0.05);
        }

        .chat-item.active {
            background: rgba(0,132,255,0.1);
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .chat-avatar .default-avatar {
            font-size: 18px;
            color: #666;
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: var(--online-indicator);
            border-radius: 50%;
            border: 2px solid white;
        }

        .chat-details {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 15px;
        }

        .chat-preview {
            font-size: 13px;
            color: var(--light-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            text-align: right;
        }

        .chat-time {
            font-size: 11px;
            color: var(--light-text);
            margin-bottom: 4px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #e5ddd5;
        }

        .chat-header {
            background: var(--sidebar-bg);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .chat-header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .chat-header-avatar .default-avatar {
            font-size: 18px;
            color: #666;
        }

        .chat-header-name {
            font-weight: 600;
            font-size: 16px;
        }

        .chat-header-status {
            font-size: 13px;
            color: var(--light-text);
        }

        .chat-header-actions {
            display: flex;
            gap: 20px;
        }

        .chat-header-actions i {
            cursor: pointer;
            font-size: 20px;
            color: var(--primary-color);
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 8px;
            position: relative;
            word-wrap: break-word;
        }

        .message-sent {
            align-self: flex-end;
            background: var(--message-sent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-received {
            align-self: flex-start;
            background: var(--message-received);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message-system {
            align-self: center;
            background: rgba(0,0,0,0.1);
            color: var(--light-text);
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 12px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 4px;
            text-align: right;
        }

        .message-actions {
            position: absolute;
            top: 5px;
            right: 8px;
            display: none;
        }

        .message:hover .message-actions {
            display: block;
        }

        .message-actions i {
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            border-radius: 4px;
            background: rgba(0,0,0,0.1);
        }

        .message-input-container {
            padding: 15px 20px;
            background: var(--sidebar-bg);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-actions {
            display: flex;
            gap: 15px;
        }

        .input-actions i {
            cursor: pointer;
            font-size: 22px;
            color: var(--primary-color);
        }

        .message-input {
            flex: 1;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        .send-button {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            min-width: 45px;
        }

        .send-button:hover {
            background: var(--primary-dark);
        }

        /* Call Screen */
        .call-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }

        .caller-info {
            text-align: center;
            margin-bottom: 40px;
        }

        .caller-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid rgba(255,255,255,0.2);
            overflow: hidden;
        }

        .caller-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .caller-avatar .default-avatar {
            font-size: 40px;
            color: #666;
        }

        .caller-name {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .call-status {
            font-size: 16px;
            color: #ccc;
        }

        .call-controls {
            display: flex;
            gap: 40px;
            margin-top: 50px;
        }

        .call-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
        }

        .accept-call {
            background: var(--secondary-color);
        }

        .reject-call {
            background: #ff3b30;
        }

        .end-call {
            background: #ff3b30;
            margin-top: 30px;
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            height: 60vh;
            margin: 20px auto;
            position: relative;
            display: none;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* REMOVED LOCAL VIDEO PIP */

        /* Login Screen */
        .login-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-title {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .mango-icon {
            font-size: 32px;
        }

        .login-button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: 600;
        }

        .login-button:hover {
            background: var(--primary-dark);
        }

        /* Connection Status */
        .connection-status {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
        }

        .connection-status.connected {
            background: var(--secondary-color);
        }

        /* File Modal */
        .file-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1500;
        }

        .file-modal-content {
            background: white;
            border-radius: 15px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
        }

        .file-modal-title {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .file-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-option {
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 12px;
        }

        .file-option:hover {
            border-color: var(--primary-color);
            background: rgba(0,132,255,0.05);
        }

        .file-option i {
            font-size: 22px;
            color: var(--primary-color);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            font-size: 22px;
            color: var(--light-text);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: 100vh;
                border-radius: 0;
            }
            .sidebar {
                width: 100%;
                height: 30%;
                min-width: auto;
            }
            .chat-area {
                width: 100%;
                height: 70%;
            }
            .message {
                max-width: 85%;
            }
            .message-input-container {
                padding: 12px 15px;
                gap: 8px;
            }
            .send-button {
                width: 42px;
                height: 42px;
                min-width: 42px;
                font-size: 16px;
            }
            .input-actions {
                gap: 12px;
            }
            .input-actions i {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .message-input-container {
                padding: 10px 12px;
            }
            .send-button {
                width: 40px;
                height: 40px;
                min-width: 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Connection Status -->
    <div class="connection-status" id="connectionStatus">
        <i class="fas fa-wifi"></i> Connecting...
    </div>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h2 class="login-title">
                <span class="mango-icon">🥭</span>
                Mango Love
                <span class="mango-icon">🥭</span>
            </h2>
            <p style="color: var(--light-text); margin-bottom: 24px; font-size: 18px;">Select baby to start loving ❤️</p>
            <div class="user-option" data-user="mango1">
                <div class="user-name">Mango 1</div>
            </div>
            <div class="user-option" data-user="mango2">
                <div class="user-name">Mango 2</div>
            </div>
            <button class="login-button" id="loginButton">Start Loving</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="profile-header">
                <div class="profile-pic" id="userProfilePic">
                    <div class="default-avatar"><i class="fas fa-user"></i></div>
                </div>
                <div class="profile-info">
                    <div class="profile-name" id="userName">User</div>
                    <div class="profile-status" id="userStatus">Offline</div>
                </div>
                <div class="header-icons">
                    <div class="icon"><i class="fas fa-circle-notch"></i></div>
                    <div class="icon"><i class="fas fa-comment-alt"></i></div>
                    <div class="icon"><i class="fas fa-ellipsis-v"></i></div>
                </div>
            </div>
            
            <!-- REMOVED SEARCH CONTAINER -->
            
            <div class="chat-list">
                <!-- Only one chat item remains -->
                <div class="chat-item active">
                    <div class="chat-avatar">
                        <div class="default-avatar"><i class="fas fa-user"></i></div>
                        <div class="online-indicator" id="onlineIndicator" style="display: none;"></div>
                    </div>
                    <div class="chat-details">
                        <div class="chat-name" id="contactName">Your Love</div>
                        <div class="chat-preview" id="chatPreview">Start loving...</div>
                    </div>
                    <div class="chat-meta">
                        <div class="chat-time">Now</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-header-avatar">
                        <div class="default-avatar"><i class="fas fa-user"></i></div>
                        <div class="online-indicator" id="chatOnlineIndicator" style="display: none;"></div>
                    </div>
                    <div>
                        <div class="chat-header-name" id="chatContactName">Your Love</div>
                        <div class="chat-header-status" id="chatContactStatus">Offline</div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <div class="icon" id="voiceCallBtn" title="Voice Call"><i class="fas fa-phone-alt"></i></div>
                    <div class="icon" id="videoCallBtn" title="Video Call"><i class="fas fa-video"></i></div>
                    <div class="icon"><i class="fas fa-ellipsis-v"></i></div>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="message message-system">
                    Welcome to Mango Love! Start loving... ❤️
                </div>
            </div>
            
            <div class="message-input-container">
                <div class="input-actions">
                    <i class="fas fa-smile"></i>
                    <i class="fas fa-paperclip" id="attachButton"></i>
                </div>
                <input type="text" class="message-input" placeholder="Type a message..." id="messageInput">
                <button class="send-button" id="sendButton">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Call Screen -->
    <div class="call-screen" id="callScreen">
        <div class="caller-info">
            <div class="caller-avatar">
                <div class="default-avatar"><i class="fas fa-user"></i></div>
            </div>
            <div class="caller-name" id="callerName">Your Love</div>
            <div class="call-status" id="callStatus">Calling...</div>
            
            <div class="video-container" id="videoContainer">
                <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
                <!-- REMOVED LOCAL VIDEO PIP -->
            </div>
        </div>
        <div class="call-controls">
            <div class="call-button accept-call" id="acceptCall">
                <i class="fas fa-phone"></i>
            </div>
            <div class="call-button reject-call" id="rejectCall">
                <i class="fas fa-phone-slash"></i>
            </div>
        </div>
        <div class="call-button end-call" id="endCall" style="display: none;">
            <i class="fas fa-phone-slash"></i>
        </div>
    </div>

    <!-- File Modal -->
    <div class="file-modal" id="fileModal">
        <div class="file-modal-content">
            <div class="close-modal" id="closeModal">&times;</div>
            <h3 class="file-modal-title">Send File</h3>
            <div class="file-options">
                <div class="file-option" id="documentOption">
                    <i class="fas fa-file"></i>
                    <div>Document</div>
                </div>
                <div class="file-option" id="galleryOption">
                    <i class="fas fa-images"></i>
                    <div>Gallery</div>
                </div>
                <div class="file-option" id="cameraOption">
                    <i class="fas fa-camera"></i>
                    <div>Camera</div>
                </div>
            </div>
        </div>
    </div>
    
    <input type="file" id="fileInput" style="display: none;">

    <script>
        // WebRTC Configuration
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Global variables
        let socket;
        let currentUser = '';
        let otherUser = '';
        let localStream;
        let remoteStream;
        let peerConnection;
        let isCallActive = false;
        let currentCallType = '';
        let callEnded = false; // Prevent infinite call end messages

        // DOM Elements
        const loginScreen = document.getElementById('loginScreen');
        const loginButton = document.getElementById('loginButton');
        const userOptions = document.querySelectorAll('.user-option');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const messagesContainer = document.getElementById('messagesContainer');
        const voiceCallBtn = document.getElementById('voiceCallBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');
        const callScreen = document.getElementById('callScreen');
        const callStatus = document.getElementById('callStatus');
        const acceptCall = document.getElementById('acceptCall');
        const rejectCall = document.getElementById('rejectCall');
        const endCall = document.getElementById('endCall');
        const videoContainer = document.getElementById('videoContainer');
        const remoteVideo = document.getElementById('remoteVideo');
        const userProfilePic = document.getElementById('userProfilePic');
        const fileInput = document.getElementById('fileInput');

        // Load profile pictures from localStorage
        function loadProfilePictures() {
            const savedProfilePic = localStorage.getItem('profilePic');
            const savedContactPic = localStorage.getItem('contactPic');
            
            if (savedProfilePic) {
                updateProfilePicture(savedProfilePic);
            }
            if (savedContactPic) {
                updateContactPicture(savedContactPic);
            }
        }

        // Update profile picture
        function updateProfilePicture(imageData) {
            const profilePics = document.querySelectorAll('.profile-pic');
            profilePics.forEach(pic => {
                const img = document.createElement('img');
                img.src = imageData;
                pic.innerHTML = '';
                pic.appendChild(img);
            });
            localStorage.setItem('profilePic', imageData);
        }

        // Update contact picture
        function updateContactPicture(imageData) {
            const contactPics = document.querySelectorAll('.chat-avatar, .chat-header-avatar, .caller-avatar');
            contactPics.forEach(pic => {
                const img = document.createElement('img');
                img.src = imageData;
                pic.innerHTML = '';
                pic.appendChild(img);
            });
            localStorage.setItem('contactPic', imageData);
        }

        // Create peer connection
        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);
            
            // Add local stream tracks
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }
            
            // Handle incoming remote stream - FIXED for bidirectional video
            peerConnection.ontrack = (event) => {
                console.log('Received remote stream with tracks:', event.streams[0].getTracks().length);
                remoteStream = event.streams[0];
                remoteVideo.srcObject = remoteStream;
                
                // Ensure video plays
                remoteVideo.onloadedmetadata = () => {
                    remoteVideo.play().catch(e => console.log('Video play error:', e));
                };
            };
            
            // Handle ICE candidates
            peerConnection.onicecandidate = (event) => {
                if (event.candidate && socket && socket.connected) {
                    socket.emit('ice-candidate', {
                        target: otherUser,
                        candidate: event.candidate
                    });
                }
            };
            
            // Connection state handling
            peerConnection.onconnectionstatechange = () => {
                console.log('Connection state:', peerConnection.connectionState);
                
                if (peerConnection.connectionState === 'connected') {
                    console.log('WebRTC connection established successfully');
                } else if (peerConnection.connectionState === 'failed' && !callEnded) {
                    console.error('WebRTC connection failed');
                    endCallHandler('Connection failed');
                }
            };
        }

        // Initialize socket
        function initializeSocket() {
            socket = io();
            
            socket.on('connect', () => {
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-wifi"></i> Connected';
                document.getElementById('connectionStatus').style.background = '#00D4AA';
            });
            
            socket.on('disconnect', () => {
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-wifi"></i> Disconnected';
                document.getElementById('connectionStatus').style.background = 'rgba(0,0,0,0.8)';
            });
            
            // User status
            socket.on('user-online', (userData) => {
                if (userData.username === otherUser) {
                    updateUserStatus(true);
                }
            });
            
            socket.on('user-offline', (userData) => {
                if (userData.username === otherUser) {
                    updateUserStatus(false);
                }
            });
            
            // Incoming call - FIXED
            socket.on('incoming-call', async (data) => {
                console.log('Incoming call from:', data.from);
                if (!isCallActive && !callEnded) {
                    showIncomingCall(data);
                }
            });
            
            socket.on('call-accepted', async (data) => {
                console.log('Call accepted by peer');
                if (peerConnection && data.answer) {
                    await peerConnection.setRemoteDescription(data.answer);
                    startCall();
                }
            });
            
            socket.on('call-rejected', () => {
                console.log('Call rejected by peer');
                if (!callEnded) {
                    endCallHandler('Call rejected');
                }
            });
            
            socket.on('call-ended', () => {
                console.log('Call ended by peer');
                if (!callEnded) {
                    callEnded = true;
                    endCallHandler('Call ended');
                }
            });
            
            socket.on('ice-candidate', async (candidate) => {
                if (peerConnection && candidate) {
                    try {
                        await peerConnection.addIceCandidate(candidate);
                    } catch (error) {
                        console.error('Error adding ICE candidate:', error);
                    }
                }
            });
            
            // Messages
            socket.on('new-message', (messageData) => {
                if (messageData.sender === otherUser) {
                    addMessage('received', messageData.text, new Date(messageData.timestamp));
                }
            });
        }

        // Show incoming call
        function showIncomingCall(data) {
            currentCallType = data.callType;
            callStatus.textContent = `Incoming ${currentCallType} call...`;
            callScreen.style.display = 'flex';
            
            if (currentCallType === 'video') {
                videoContainer.style.display = 'block';
            }
            
            // Create peer connection for incoming call
            createPeerConnection();
            
            // Set remote description
            if (data.offer) {
                peerConnection.setRemoteDescription(data.offer)
                    .then(() => {
                        console.log('Remote description set for incoming call');
                    })
                    .catch(error => {
                        console.error('Error setting remote description:', error);
                    });
            }
        }

        // Start call
        function startCall() {
            isCallActive = true;
            callEnded = false;
            callStatus.textContent = `${currentCallType} call connected`;
            acceptCall.style.display = 'none';
            rejectCall.style.display = 'none';
            endCall.style.display = 'flex';
            
            if (currentCallType === 'video') {
                videoContainer.style.display = 'block';
            }
        }

        // Initiate call - FIXED with proper media handling
        async function initiateCall(callType) {
            if (!socket.connected) {
                alert('Not connected to server');
                return;
            }
            
            currentCallType = callType;
            callEnded = false;
            
            try {
                // Get media stream
                const constraints = {
                    audio: true,
                    video: callType === 'video'
                };
                
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                console.log('Local stream obtained with tracks:', localStream.getTracks().length);
                
                createPeerConnection();
                
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                socket.emit('call-user', {
                    target: otherUser,
                    from: currentUser,
                    offer: offer,
                    callType: callType
                });
                
                callStatus.textContent = 'Calling...';
                callScreen.style.display = 'flex';
                
                if (callType === 'video') {
                    videoContainer.style.display = 'block';
                }
                
            } catch (error) {
                console.error('Error starting call:', error);
                alert(`Failed to start ${callType} call: ${error.message}`);
            }
        }

        // Accept call - FIXED with proper media handling
        async function acceptIncomingCall() {
            try {
                // Get media stream
                const constraints = {
                    audio: true,
                    video: currentCallType === 'video'
                };
                
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                console.log('Local stream obtained for accepting call with tracks:', localStream.getTracks().length);
                
                // Add local tracks to existing peer connection
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
                
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                
                socket.emit('accept-call', {
                    from: otherUser,
                    answer: answer
                });
                
                startCall();
                
            } catch (error) {
                console.error('Error accepting call:', error);
                endCallHandler('Failed to accept call');
            }
        }

        // Reject call
        function rejectIncomingCall() {
            socket.emit('reject-call', { from: otherUser });
            endCallHandler('Call rejected');
        }

        // End call - FIXED to prevent infinite messages
        function endCallHandler(reason) {
            if (callEnded) return;
            
            callEnded = true;
            isCallActive = false;
            callScreen.style.display = 'none';
            videoContainer.style.display = 'none';
            
            // Stop all tracks
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    track.stop();
                });
                localStream = null;
            }
            
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            // Notify other user only if we're the one ending the call
            if (socket && socket.connected && reason !== 'Call ended' && reason !== 'Call rejected') {
                socket.emit('end-call', { target: otherUser });
            }
            
            // Add call log to chat only once and only for specific reasons
            if (reason && reason !== 'Call rejected' && !reason.includes('Failed')) {
                addMessage('system', `${currentCallType} call ${reason}`, new Date());
            }
            
            console.log('Call ended:', reason);
        }

        // Update user status
        function updateUserStatus(isOnline) {
            const status = isOnline ? 'Online' : 'Offline';
            const indicator = isOnline ? 'block' : 'none';
            
            document.getElementById('userStatus').textContent = status;
            document.getElementById('chatContactStatus').textContent = status;
            document.getElementById('onlineIndicator').style.display = indicator;
            document.getElementById('chatOnlineIndicator').style.display = indicator;
        }

        // Send message
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            const messageData = {
                text: text,
                sender: currentUser,
                timestamp: Date.now(),
                receiver: otherUser
            };
            
            socket.emit('send-message', messageData);
            addMessage('sent', text, new Date());
            messageInput.value = '';
        }

        // Add message (permanent until deleted)
        function addMessage(type, text, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            
            const timeString = timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <div>${text}</div>
                <div class="message-time">${timeString}</div>
                ${type === 'sent' ? '<div class="message-actions"><i class="fas fa-trash" onclick="deleteMessage(this)"></i></div>' : ''}
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Delete message
        function deleteMessage(deleteIcon) {
            const messageDiv = deleteIcon.closest('.message');
            messageDiv.style.opacity = '0.5';
            messageDiv.style.textDecoration = 'line-through';
            setTimeout(() => {
                messageDiv.remove();
            }, 1000);
        }

        // Change profile picture
        function changeProfilePicture() {
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        updateProfilePicture(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };
            fileInput.click();
        }

        // User login
        function handleLogin() {
            const selected = document.querySelector('.user-option.active');
            if (!selected) {
                alert('Please select a user');
                return;
            }
            
            currentUser = selected.dataset.user;
            otherUser = currentUser === 'mango1' ? 'mango2' : 'mango1';
            
            // Update UI
            document.getElementById('userName').textContent = currentUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('contactName').textContent = otherUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('chatContactName').textContent = otherUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('callerName').textContent = otherUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            
            loginScreen.style.display = 'none';
            
            socket.emit('user-login', {
                username: currentUser,
                userId: socket.id
            });
            
            addMessage('system', `Connected with ${otherUser === 'mango1' ? 'Mango 1' : 'Mango 2'}! Start loving. ❤️`, new Date());
        }

        // Event listeners
        loginButton.addEventListener('click', handleLogin);
        
        userOptions.forEach(option => {
            option.addEventListener('click', () => {
                userOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
            });
        });

        sendButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        voiceCallBtn.addEventListener('click', () => initiateCall('voice'));
        videoCallBtn.addEventListener('click', () => initiateCall('video'));
        acceptCall.addEventListener('click', acceptIncomingCall);
        rejectCall.addEventListener('click', rejectIncomingCall);
        endCall.addEventListener('click', () => endCallHandler('ended'));

        userProfilePic.addEventListener('click', changeProfilePicture);

        // Initialize app
        async function initApp() {
            loadProfilePictures();
            initializeSocket();
        }

        // Start app
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
