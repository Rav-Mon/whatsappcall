<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Chat - Private</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        :root {
            --primary-color: #128C7E;
            --primary-dark: #075E54;
            --secondary-color: #25D366;
            --chat-bg-sent: #DCF8C6;
            --chat-bg-received: #FFFFFF;
            --text-color: #303030;
            --light-text: #667781;
            --border-color: #e0e0e0;
            --online-indicator: #4ad504;
        }

        body {
            background: linear-gradient(to bottom, var(--primary-color), var(--primary-dark));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            height: 95vh;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 30%;
            background-color: #f0f0f0;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }

        .profile-header {
            background-color: var(--primary-dark);
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-info {
            display: flex;
            align-items: center;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ddd;
            margin-right: 10px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 2px solid white;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic .change-photo {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 10px;
            text-align: center;
            padding: 2px;
            display: none;
        }

        .profile-pic:hover .change-photo {
            display: block;
        }

        .profile-name {
            font-weight: 500;
            font-size: 16px;
        }

        .profile-status {
            font-size: 12px;
            opacity: 0.8;
        }

        .icons {
            display: flex;
            gap: 15px;
        }

        .icon {
            cursor: pointer;
            font-size: 18px;
            color: white;
        }

        .search-container {
            padding: 10px;
            background-color: white;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            background-color: #f5f5f5;
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
        }

        .search-box i {
            color: var(--light-text);
            margin-right: 10px;
        }

        .search-box input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 14px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .chat-item:hover {
            background-color: #f5f5f5;
        }

        .chat-item.active {
            background-color: #e9e9e9;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ddd;
            margin-right: 15px;
            position: relative;
            flex-shrink: 0;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background-color: var(--online-indicator);
            border-radius: 50%;
            border: 2px solid white;
        }

        .chat-details {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 16px;
            color: var(--text-color);
        }

        .chat-preview {
            font-size: 13px;
            color: var(--light-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .chat-time {
            font-size: 12px;
            color: var(--light-text);
            margin-bottom: 5px;
        }

        .unread-count {
            background-color: var(--primary-color);
            color: white;
            font-size: 12px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Chat Area Styles */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #e5ddd5;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23e6e6e6' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .chat-header {
            background-color: var(--primary-dark);
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ddd;
            margin-right: 15px;
            position: relative;
            flex-shrink: 0;
        }

        .chat-header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .chat-header-details {
            flex: 1;
        }

        .chat-header-name {
            font-weight: 500;
            font-size: 16px;
        }

        .chat-header-status {
            font-size: 12px;
            opacity: 0.8;
        }

        .chat-header-actions {
            display: flex;
            gap: 20px;
        }

        .chat-header-actions i {
            cursor: pointer;
            font-size: 20px;
            color: white;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 65%;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 7.5px;
            position: relative;
            word-wrap: break-word;
        }

        .message-sent {
            align-self: flex-end;
            background-color: var(--chat-bg-sent);
        }

        .message-received {
            align-self: flex-start;
            background-color: var(--chat-bg-received);
            box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.1);
        }

        .message-system {
            align-self: center;
            background-color: rgba(0, 0, 0, 0.1);
            color: var(--light-text);
            font-size: 13px;
            max-width: 80%;
            text-align: center;
        }

        .message-time {
            font-size: 11px;
            color: var(--light-text);
            text-align: right;
            margin-top: 5px;
        }

        .message-actions {
            position: absolute;
            top: 5px;
            right: 10px;
            display: none;
        }

        .message:hover .message-actions {
            display: block;
        }

        .message-actions i {
            cursor: pointer;
            color: var(--light-text);
            margin-left: 5px;
            font-size: 12px;
        }

        .message-file {
            display: flex;
            align-items: center;
            margin-top: 5px;
            padding: 8px;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 5px;
        }

        .message-file i {
            margin-right: 8px;
            font-size: 20px;
        }

        .message-input-container {
            padding: 15px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
        }

        .input-actions {
            display: flex;
            gap: 15px;
            margin-right: 15px;
        }

        .input-actions i {
            cursor: pointer;
            color: var(--light-text);
            font-size: 22px;
        }

        .message-input {
            flex: 1;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        .send-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-left: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background-color: var(--primary-dark);
        }

        .send-button i {
            font-size: 20px;
        }

        /* Call Screen Styles */
        .call-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }

        .caller-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .caller-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #333;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        .caller-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .caller-name {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .call-status {
            font-size: 16px;
            color: #ccc;
        }

        .call-controls {
            display: flex;
            gap: 40px;
            margin-top: 50px;
        }

        .call-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .call-button:hover {
            transform: scale(1.1);
        }

        .accept-call {
            background-color: var(--secondary-color);
        }

        .reject-call {
            background-color: #ff3b30;
        }

        .end-call {
            background-color: #ff3b30;
            margin-top: 30px;
        }

        .call-button i {
            font-size: 24px;
            color: white;
        }

        /* Login Screen */
        .login-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, var(--primary-color), var(--primary-dark));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
        }

        .login-container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            text-align: center;
        }

        .login-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-dark);
        }

        .user-option {
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-option:hover {
            border-color: var(--primary-color);
            background-color: rgba(18, 140, 126, 0.05);
        }

        .user-option.active {
            border-color: var(--primary-color);
            background-color: rgba(18, 140, 126, 0.1);
        }

        .user-name {
            font-weight: 500;
            font-size: 18px;
        }

        .login-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: background-color 0.2s;
        }

        .login-button:hover {
            background-color: var(--primary-dark);
        }

        /* Connection Status */
        .connection-status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .connection-status.connected {
            background: var(--secondary-color);
        }

        .connection-status.disconnected {
            background: #ff3b30;
        }

        /* Video Elements */
        .video-container {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            position: relative;
            display: none;
        }

        .video-container video {
            width: 100%;
            border-radius: 10px;
            background: #000;
        }

        .local-video {
            position: absolute;
            width: 120px;
            height: 90px;
            bottom: 10px;
            right: 10px;
            border: 2px solid white;
            border-radius: 5px;
        }

        .call-quality {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 30%;
            }
            
            .chat-area {
                width: 100%;
                height: 70%;
            }
            
            .message {
                max-width: 85%;
            }
            
            .profile-header, .chat-header {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Connection Status -->
    <div class="connection-status disconnected" id="connectionStatus">
        <i class="fas fa-wifi"></i> Connecting...
    </div>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h2 class="login-title">Mango Chat</h2>
            <p>Select your user to start chatting</p>
            <div class="user-option" data-user="mango1">
                <div class="user-name">Mango 1</div>
            </div>
            <div class="user-option" data-user="mango2">
                <div class="user-name">Mango 2</div>
            </div>
            <button class="login-button" id="loginButton">Start Chatting</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="profile-header">
                <div class="profile-info">
                    <div class="profile-pic" id="userProfilePic">
                        <img src="https://i.pravatar.cc/150?img=1" alt="Profile" id="profileImage">
                        <div class="change-photo">Change</div>
                    </div>
                    <div>
                        <div class="profile-name" id="userName">Mango 1</div>
                        <div class="profile-status" id="userStatus">Offline</div>
                    </div>
                </div>
                <div class="icons">
                    <div class="icon" id="statusIcon"><i class="fas fa-circle-notch"></i></div>
                    <div class="icon" id="newChatIcon"><i class="fas fa-comment-alt"></i></div>
                    <div class="icon" id="menuIcon"><i class="fas fa-ellipsis-v"></i></div>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search or start new chat">
                </div>
            </div>
            
            <div class="chat-list">
                <div class="chat-item active" id="chatItem">
                    <div class="chat-avatar">
                        <img src="https://i.pravatar.cc/150?img=2" alt="Mango 2" id="contactImage">
                        <div class="online-indicator" id="onlineIndicator" style="display: none;"></div>
                    </div>
                    <div class="chat-details">
                        <div class="chat-name" id="contactName">Mango 2</div>
                        <div class="chat-preview" id="chatPreview">Click to start chatting...</div>
                    </div>
                    <div class="chat-meta">
                        <div class="chat-time" id="chatTime">Now</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-header-avatar">
                        <img src="https://i.pravatar.cc/150?img=2" alt="Mango 2" id="chatContactImage">
                        <div class="online-indicator" id="chatOnlineIndicator" style="display: none;"></div>
                    </div>
                    <div class="chat-header-details">
                        <div class="chat-header-name" id="chatContactName">Mango 2</div>
                        <div class="chat-header-status" id="chatContactStatus">Offline</div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <div class="icon" id="voiceCallBtn"><i class="fas fa-phone-alt"></i></div>
                    <div class="icon" id="videoCallBtn"><i class="fas fa-video"></i></div>
                    <div class="icon" id="chatMenuBtn"><i class="fas fa-ellipsis-v"></i></div>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="message message-system">
                    Welcome to Mango Chat! Select your user to start chatting with your partner.
                </div>
            </div>
            
            <div class="message-input-container">
                <div class="input-actions">
                    <i class="fas fa-smile"></i>
                    <i class="fas fa-paperclip" id="attachButton"></i>
                </div>
                <input type="text" class="message-input" placeholder="Type a message" id="messageInput">
                <div class="send-button" id="sendButton">
                    <i class="fas fa-paper-plane"></i>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Call Screen -->
    <div class="call-screen" id="callScreen">
        <div class="caller-info">
            <div class="caller-avatar">
                <img src="https://i.pravatar.cc/150?img=2" alt="Caller" id="callerImage">
            </div>
            <div class="caller-name" id="callerName">Mango 2</div>
            <div class="call-status" id="callStatus">Calling...</div>
            
            <!-- Video containers for video calls -->
            <div class="video-container" id="videoContainer">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" class="local-video" autoplay playsinline muted></video>
                <div class="call-quality" id="callQuality">Connecting...</div>
            </div>
        </div>
        <div class="call-controls">
            <div class="call-button accept-call" id="acceptCall">
                <i class="fas fa-phone"></i>
            </div>
            <div class="call-button reject-call" id="rejectCall">
                <i class="fas fa-phone-slash"></i>
            </div>
        </div>
        <div class="call-button end-call" id="endCall" style="display: none;">
            <i class="fas fa-phone-slash"></i>
        </div>
    </div>

    <script>
        // WebRTC Configuration
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Global variables
        let socket;
        let currentUser = '';
        let otherUser = '';
        let localStream;
        let remoteStream;
        let peerConnection;
        let isCallActive = false;
        let isInitiator = false;
        let currentCallType = '';

        // DOM Elements
        const connectionStatus = document.getElementById('connectionStatus');
        const loginScreen = document.getElementById('loginScreen');
        const loginButton = document.getElementById('loginButton');
        const userOptions = document.querySelectorAll('.user-option');
        const userStatus = document.getElementById('userStatus');
        const onlineIndicator = document.getElementById('onlineIndicator');
        const chatOnlineIndicator = document.getElementById('chatOnlineIndicator');
        const chatContactStatus = document.getElementById('chatContactStatus');
        const voiceCallBtn = document.getElementById('voiceCallBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');
        const callScreen = document.getElementById('callScreen');
        const callStatus = document.getElementById('callStatus');
        const acceptCall = document.getElementById('acceptCall');
        const rejectCall = document.getElementById('rejectCall');
        const endCall = document.getElementById('endCall');
        const videoContainer = document.getElementById('videoContainer');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const callQuality = document.getElementById('callQuality');

        // Initialize WebRTC
        async function initializeWebRTC() {
            try {
                // Request camera and microphone permissions
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: true 
                });
                localVideo.srcObject = localStream;
                console.log('Media devices accessed successfully');
            } catch (error) {
                console.warn('Error accessing media devices:', error);
            }
        }

        // Create peer connection
        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);
            
            // Add local stream to connection
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }
            
            // Handle incoming stream
            peerConnection.ontrack = (event) => {
                remoteStream = event.streams[0];
                remoteVideo.srcObject = remoteStream;
                updateCallQuality('Connected');
            };
            
            // Handle ICE candidates
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', {
                        target: otherUser,
                        candidate: event.candidate
                    });
                }
            };
            
            // Connection state handling
            peerConnection.onconnectionstatechange = () => {
                updateCallQuality(peerConnection.connectionState);
            };
        }

        // Update call quality display
        function updateCallQuality(status) {
            const statusMap = {
                'connected': '✅ Excellent',
                'checking': '🔄 Connecting...',
                'completed': '✅ Connected',
                'disconnected': '⚠️ Poor Connection',
                'failed': '❌ Failed',
                'new': '🔄 Starting...'
            };
            
            callQuality.textContent = statusMap[status] || status;
        }

        // Initialize socket connection
        function initializeSocket() {
            // Connect to signaling server
            socket = io();
            
            socket.on('connect', () => {
                connectionStatus.className = 'connection-status connected';
                connectionStatus.innerHTML = '<i class="fas fa-wifi"></i> Connected';
                console.log('Connected to signaling server');
            });
            
            socket.on('disconnect', () => {
                connectionStatus.className = 'connection-status disconnected';
                connectionStatus.innerHTML = '<i class="fas fa-wifi"></i> Disconnected';
            });
            
            // WebRTC signaling handlers
            socket.on('offer', async (data) => {
                console.log('Received offer from:', data.caller.username);
                await handleIncomingCall(data);
            });
            
            socket.on('answer', async (data) => {
                console.log('Received answer from:', data.callee.username);
                await peerConnection.setRemoteDescription(data.answer);
            });
            
            socket.on('ice-candidate', async (candidate) => {
                await peerConnection.addIceCandidate(candidate);
            });
            
            // Call management
            socket.on('incoming-call', async (data) => {
                console.log('Incoming call from:', data.from.username);
                showIncomingCall(data);
            });
            
            socket.on('call-accepted', async (data) => {
                console.log('Call accepted');
                await peerConnection.setRemoteDescription(data.answer);
                startCall();
            });
            
            socket.on('call-rejected', (data) => {
                console.log('Call rejected:', data.reason);
                endCallHandler('Call rejected');
            });
            
            socket.on('call-ended', () => {
                console.log('Call ended by other user');
                endCallHandler('Call ended');
            });
            
            // User status
            socket.on('user-online', (userData) => {
                if (userData.username === otherUser) {
                    updateUserStatus(true);
                }
            });
            
            socket.on('user-offline', (userData) => {
                if (userData.username === otherUser) {
                    updateUserStatus(false);
                }
            });
            
            // Messaging
            socket.on('new-message', (messageData) => {
                if (messageData.sender === otherUser) {
                    addMessage('received', messageData.text, new Date(messageData.timestamp));
                }
            });
        }

        // Handle incoming call
        async function handleIncomingCall(data) {
            createPeerConnection();
            await peerConnection.setRemoteDescription(data.offer);
            
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            
            socket.emit('answer', {
                target: data.caller.username,
                answer: answer
            });
        }

        // Show incoming call UI
        function showIncomingCall(data) {
            currentCallType = data.callType;
            isInitiator = false;
            
            callStatus.textContent = `Incoming ${currentCallType} call...`;
            callScreen.style.display = 'flex';
            
            if (currentCallType === 'video') {
                videoContainer.style.display = 'block';
            }
        }

        // Start a call
        async function startCall() {
            isCallActive = true;
            callStatus.textContent = `${currentCallType.charAt(0).toUpperCase() + currentCallType.slice(1)} call connected`;
            
            if (isInitiator) {
                acceptCall.style.display = 'none';
                rejectCall.style.display = 'none';
            }
            endCall.style.display = 'flex';
            
            if (currentCallType === 'video') {
                videoContainer.style.display = 'block';
                localVideo.srcObject = localStream;
            }
        }

        // Initiate a call
        async function initiateCall(callType) {
            if (!socket || !socket.connected) {
                alert('Not connected to server. Please refresh and try again.');
                return;
            }
            
            currentCallType = callType;
            isInitiator = true;
            
            callStatus.textContent = 'Calling...';
            callScreen.style.display = 'flex';
            
            if (callType === 'video') {
                videoContainer.style.display = 'block';
            }
            
            try {
                createPeerConnection();
                
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                socket.emit('call-user', {
                    target: otherUser,
                    offer: offer,
                    callType: callType
                });
                
                // Set timeout for no answer
                setTimeout(() => {
                    if (!isCallActive) {
                        endCallHandler('No answer');
                    }
                }, 30000);
                
            } catch (error) {
                console.error('Error creating offer:', error);
                endCallHandler('Call failed');
            }
        }

        // Accept incoming call
        async function acceptIncomingCall() {
            try {
                createPeerConnection();
                
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                socket.emit('accept-call', {
                    from: otherUser,
                    answer: offer
                });
                
                startCall();
            } catch (error) {
                console.error('Error accepting call:', error);
                endCallHandler('Call failed');
            }
        }

        // Reject incoming call
        function rejectIncomingCall() {
            socket.emit('reject-call', {
                from: otherUser,
                reason: 'User rejected call'
            });
            endCallHandler('Call rejected');
        }

        // End call handler
        function endCallHandler(reason) {
            isCallActive = false;
            callScreen.style.display = 'none';
            videoContainer.style.display = 'none';
            
            // Stop all tracks
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            // Notify other user
            if (socket && socket.connected) {
                socket.emit('end-call', { target: otherUser });
            }
            
            // Add call log to chat
            if (reason !== 'Call rejected' && reason !== 'No answer') {
                addMessage('system', `${currentCallType} call ${reason}`, new Date());
            }
            
            // Reinitialize media for next call
            setTimeout(initializeWebRTC, 1000);
        }

        // Update user status
        function updateUserStatus(isOnline) {
            const statusText = isOnline ? 'Online' : 'Offline';
            const indicatorDisplay = isOnline ? 'block' : 'none';
            
            userStatus.textContent = statusText;
            chatContactStatus.textContent = statusText;
            onlineIndicator.style.display = indicatorDisplay;
            chatOnlineIndicator.style.display = indicatorDisplay;
            
            // Enable/disable call buttons based on online status
            voiceCallBtn.style.opacity = isOnline ? '1' : '0.5';
            videoCallBtn.style.opacity = isOnline ? '1' : '0.5';
        }

        // Send message
        function sendMessage() {
            const text = document.getElementById('messageInput').value.trim();
            if (text === '') return;
            
            const messageData = {
                text: text,
                sender: currentUser,
                timestamp: new Date().getTime(),
                receiver: otherUser
            };
            
            socket.emit('send-message', messageData);
            addMessage('sent', text, new Date());
            document.getElementById('messageInput').value = '';
        }

        // Add message to UI
        function addMessage(type, text, timestamp) {
            const messagesContainer = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            
            const timeString = timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <div>${text}</div>
                <div class="message-time">${timeString}</div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // User login
        function handleLogin() {
            const selectedUser = document.querySelector('.user-option.active');
            if (!selectedUser) {
                alert('Please select a user');
                return;
            }
            
            currentUser = selectedUser.dataset.user;
            otherUser = currentUser === 'mango1' ? 'mango2' : 'mango1';
            
            // Update UI
            document.getElementById('userName').textContent = currentUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('contactName').textContent = otherUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('chatContactName').textContent = otherUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('callerName').textContent = otherUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            
            // Set profile images
            const profileImages = {
                mango1: 'https://i.pravatar.cc/150?img=1',
                mango2: 'https://i.pravatar.cc/150?img=2'
            };
            
            document.getElementById('profileImage').src = profileImages[currentUser];
            document.getElementById('contactImage').src = profileImages[otherUser];
            document.getElementById('chatContactImage').src = profileImages[otherUser];
            document.getElementById('callerImage').src = profileImages[otherUser];
            
            // Hide login screen
            loginScreen.style.display = 'none';
            
            // Login to socket
            socket.emit('user-login', {
                username: currentUser,
                userId: socket.id
            });
            
            // Add welcome message
            addMessage('system', `You and ${otherUser === 'mango1' ? 'Mango 1' : 'Mango 2'} are now connected. Start chatting!`, new Date());
        }

        // Event listeners
        document.getElementById('loginButton').addEventListener('click', handleLogin);
        userOptions.forEach(option => {
            option.addEventListener('click', () => {
                userOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
            });
        });

        document.getElementById('sendButton').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        voiceCallBtn.addEventListener('click', () => initiateCall('voice'));
        videoCallBtn.addEventListener('click', () => initiateCall('video'));
        acceptCall.addEventListener('click', acceptIncomingCall);
        rejectCall.addEventListener('click', rejectIncomingCall);
        endCall.addEventListener('click', () => endCallHandler('ended'));

        // Initialize app
        async function initApp() {
            initializeSocket();
            await initializeWebRTC();
        }

        // Start the app
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
