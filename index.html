<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Love</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
        :root{
            --primary:#0084FF;--primary-dark:#0066CC;--secondary:#00D4AA;
            --sidebar:#F0F2F5;--sent:#0084FF;--received:#FFF;--text:#303030;
            --light:#667781;--border:#e0e0e0;--online:#00D4AA;
            --card:#fff;--card-hover:#f5f9ff;--card-active:#e6f0ff;
            --mango-gradient: linear-gradient(135deg, #FFD700, #FFA500);
        }
        body{
            background:linear-gradient(135deg,var(--primary),var(--primary-dark));
            height:100vh;display:flex;justify-content:center;align-items:center;
            padding:10px;overflow:hidden;
        }
        .container{
            width:100%;max-width:1400px;height:95vh;background:#fff;
            border-radius:10px;box-shadow:0 5px 20px rgba(0,0,0,.2);
            display:flex;overflow:hidden;display:none;
        }

        /* Sidebar */
        .sidebar{width:30%;min-width:300px;background:var(--sidebar);
                 border-right:1px solid var(--border);display:flex;flex-direction:column;}
        .profile-header{background:var(--primary-dark);color:#fff;padding:15px;
                        display:flex;align-items:center;gap:12px;}
        .profile-pic{width:45px;height:45px;border-radius:50%;background:#ddd;
                     display:flex;align-items:center;justify-content:center;
                     cursor:pointer;border:2px solid #fff;overflow:hidden;}
        .profile-pic img{width:100%;height:100%;object-fit:cover;}
        .profile-pic .default-avatar{font-size:20px;color:#666;}
        .profile-info{flex:1;}
        .profile-name{font-weight:600;font-size:16px;}
        .profile-status{font-size:12px;opacity:.9;}
        .header-icons{display:flex;gap:15px;}
        .icon{cursor:pointer;font-size:18px;color:#fff;}

        .chat-list{flex:1;overflow-y:auto;padding:10px 0;}
        .chat-item{display:flex;padding:15px;border-bottom:1px solid var(--border);
                   cursor:pointer;gap:12px;align-items:center;}
        .chat-item:hover{background:rgba(0,0,0,.05);}
        .chat-item.active{background:rgba(0,132,255,.1);}
        .chat-avatar{width:50px;height:50px;border-radius:50%;background:#ddd;
                     display:flex;align-items:center;justify-content:center;
                     position:relative;overflow:hidden;}
        .chat-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
        .chat-avatar .default-avatar{font-size:18px;color:#666;}
        .online-indicator{position:absolute;bottom:2px;right:2px;width:12px;height:12px;
                          background:var(--online);border-radius:50%;border:2px solid #fff;}
        .chat-details{flex:1;}
        .chat-name{font-weight:600;margin-bottom:4px;font-size:15px;}
        .chat-preview{font-size:13px;color:var(--light);white-space:nowrap;
                      overflow:hidden;text-overflow:ellipsis;}
        .chat-meta{text-align:right;}
        .chat-time{font-size:11px;color:var(--light);margin-bottom:4px;}

        /* Chat Area */
        .chat-area{flex:1;display:flex;flex-direction:column;background:#e5ddd5;}
        .chat-header{background:var(--sidebar);padding:15px 20px;
                     display:flex;align-items:center;justify-content:space-between;
                     border-bottom:1px solid var(--border);}
        .chat-header-info{display:flex;align-items:center;gap:12px;}
        .chat-header-avatar{width:45px;height:45px;border-radius:50%;background:#ddd;
                            display:flex;align-items:center;justify-content:center;
                            position:relative;overflow:hidden;}
        .chat-header-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
        .chat-header-avatar .default-avatar{font-size:18px;color:#666;}
        .chat-header-name{font-weight:600;font-size:16px;}
        .chat-header-status{font-size:13px;color:var(--light);}
        .chat-header-actions{display:flex;gap:20px;}
        .chat-header-actions i{cursor:pointer;font-size:20px;color:var(--primary);}

        .messages-container{flex:1;padding:20px;overflow-y:auto;
                            display:flex;flex-direction:column;gap:8px;}
        .message{max-width:70%;padding:10px 15px;border-radius:8px;position:relative;
                 word-wrap:break-word;}
        .message-sent{align-self:flex-end;background:var(--sent);color:#fff;
                      border-bottom-right-radius:4px;}
        .message-received{align-self:flex-start;background:var(--received);color:var(--text);
                          border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1);}
        .message-system{align-self:center;background:rgba(0,0,0,.1);color:var(--light);
                        font-size:13px;padding:8px 16px;border-radius:12px;}
        .message-time{font-size:11px;opacity:.8;margin-top:4px;text-align:right;}

        .message-input-container{padding:15px 20px;background:var(--sidebar);
                                 display:flex;align-items:center;gap:12px;}
        .input-actions{display:flex;gap:15px;}
        .input-actions i{cursor:pointer;font-size:22px;color:var(--primary);}
        .message-input{flex:1;border:none;border-radius:20px;padding:12px 20px;
                       outline:none;font-size:15px;background:#fff;}
        .send-button{background:var(--primary);color:#fff;border:none;
                     width:45px;height:45px;border-radius:50%;cursor:pointer;
                     display:flex;align-items:center;justify-content:center;
                     font-size:18px;}
        .send-button:hover{background:var(--primary-dark);}

        /* Login Screen */
        .login-screen{position:absolute;top:0;left:0;right:0;bottom:0;
                      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
                      display:flex;justify-content:center;align-items:center;z-index:2000;}
        .login-container{background:#fff;border-radius:15px;padding:40px;
                         width:90%;max-width:400px;text-align:center;
                         box-shadow:0 10px 30px rgba(0,0,0,.3);}
        
        /* Mango Love Title - SAME YELLOW GRADIENT AS 1 & 2 */
        .login-title{
            background: var(--mango-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 16px;
            text-align: center;
            display: inline-block;
        }

        .login-subtitle{color:var(--light);margin-bottom:30px;font-size:16px;}

        .user-selection{display:flex;flex-direction:column;gap:16px;margin-bottom:24px;}
        .user-card{background:var(--card);border:2px solid var(--border);
                   border-radius:12px;padding:16px;display:flex;align-items:center;
                   gap:14px;cursor:pointer;transition:all .2s ease;
                   box-shadow:0 2px 8px rgba(0,0,0,.05);}
        .user-card:hover{border-color:var(--primary);background:var(--card-hover);
                         transform:translateY(-2px);}
        .user-card.active{border-color:var(--primary);background:var(--card-active);
                          font-weight:600;}
        .user-card .avatar{
            width:50px;height:50px;border-radius:50%;
            background: var(--mango-gradient);
            display:flex;align-items:center;justify-content:center;
            font-size:20px;color:#fff;font-weight:bold;
        }
        .user-card .name{font-size:17px;color:var(--text);}

        .login-button{background:var(--primary);color:#fff;border:none;
                      border-radius:25px;padding:14px 30px;font-size:16px;
                      cursor:pointer;width:100%;font-weight:600;transition:.2s;}
        .login-button:hover{background:var(--primary-dark);}
        .login-button:disabled{background:#aaa;cursor:not-allowed;}

        .connection-status{position:fixed;top:15px;right:15px;background:rgba(0,0,0,.8);
                           color:#fff;padding:8px 15px;border-radius:20px;
                           font-size:14px;z-index:1000;}
        .connection-status.connected{background:var(--secondary);}

        @media (max-width:768px){
            .container{flex-direction:column;height:100vh;border-radius:0;}
            .sidebar{width:100%;height:30%;min-width:auto;}
            .chat-area{width:100%;height:70%;}
        }
    </style>
</head>
<body>

    <div class="connection-status" id="connectionStatus">
        <i class="fas fa-wifi"></i> Connecting...
    </div>

    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h2 class="login-title">Mango Love</h2>
            <p class="login-subtitle">Select baby to start loving</p>

            <div class="user-selection">
                <div class="user-card" data-user="mango1">
                    <div class="avatar">1</div>
                    <div class="name">Mango 1</div>
                </div>
                <div class="user-card" data-user="mango2">
                    <div class="avatar">2</div>
                    <div class="name">Mango 2</div>
                </div>
            </div>

            <button class="login-button" id="loginButton" disabled>Start Loving</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="container" id="mainContainer">
        <div class="sidebar">
            <div class="profile-header">
                <div class="profile-pic" id="userProfilePic">
                    <div class="default-avatar"><i class="fas fa-user"></i></div>
                </div>
                <div class="profile-info">
                    <div class="profile-name" id="userName">User</div>
                    <div class="profile-status" id="userStatus">Offline</div>
                </div>
                <div class="header-icons">
                    <div class="icon"><i class="fas fa-circle-notch"></i></div>
                    <div class="icon"><i class="fas fa-comment-alt"></i></div>
                    <div class="icon"><i class="fas fa-ellipsis-v"></i></div>
                </div>
            </div>

            <div class="chat-list">
                <div class="chat-item active">
                    <div class="chat-avatar">
                        <div class="default-avatar"><i class="fas fa-user"></i></div>
                        <div class="online-indicator" id="onlineIndicator" style="display:none;"></div>
                    </div>
                    <div class="chat-details">
                        <div class="chat-name" id="contactName">Your Love</div>
                        <div class="chat-preview" id="chatPreview">Start loving...</div>
                    </div>
                    <div class="chat-meta"><div class="chat-time">Now</div></div>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-header-avatar">
                        <div class="default-avatar"><i class="fas fa-user"></i></div>
                        <div class="online-indicator" id="chatOnlineIndicator" style="display:none;"></div>
                    </div>
                    <div>
                        <div class="chat-header-name" id="chatContactName">Your Love</div>
                        <div class="chat-header-status" id="chatContactStatus">Offline</div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <div class="icon" id="voiceCallBtn" title="Voice Call"><i class="fas fa-phone-alt"></i></div>
                    <div class="icon" id="videoCallBtn" title="Video Call"><i class="fas fa-video"></i></div>
                    <div class="icon"><i class="fas fa-ellipsis-v"></i></div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="message message-system">
                    Welcome to Mango Love! Start loving...
                </div>
            </div>

            <div class="message-input-container">
                <div class="input-actions">
                    <i class="fas fa-smile"></i>
                    <i class="fas fa-paperclip" id="attachButton"></i>
                </div>
                <input type="text" class="message-input" placeholder="Type a message..." id="messageInput">
                <button class="send-button" id="sendButton"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none;">

    <script>
        let socket, currentUser = '', otherUser = '', localStream, peerConnection,
            isCallActive = false, currentCallType = '', callEnded = false;

        const loginScreen = document.getElementById('loginScreen');
        const mainContainer = document.getElementById('mainContainer');
        const loginButton = document.getElementById('loginButton');
        const userCards = document.querySelectorAll('.user-card');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const messagesContainer = document.getElementById('messagesContainer');
        const voiceCallBtn = document.getElementById('voiceCallBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');
        const userProfilePic = document.getElementById('userProfilePic');
        const fileInput = document.getElementById('fileInput');

        let selectedUser = null;
        userCards.forEach(card => {
            card.addEventListener('click', () => {
                userCards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                selectedUser = card.dataset.user;
                loginButton.disabled = false;
            });
        });

        loginButton.addEventListener('click', () => {
            if (!selectedUser) return;
            currentUser = selectedUser;
            otherUser = currentUser === 'mango1' ? 'mango2' : 'mango1';

            document.getElementById('userName').textContent = currentUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('contactName').textContent = otherUser === 'mango1' ? 'Mango 1' : 'Mango 2';
            document.getElementById('chatContactName').textContent = otherUser === 'mango1' ? 'Mango 1' : 'Mango 2';

            loginScreen.style.display = 'none';
            mainContainer.style.display = 'flex';

            initializeSocket();
            loadProfilePictures();
        });

        function initializeSocket() {
            socket = io();
            socket.on('connect', () => {
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-wifi"></i> Connected';
                document.getElementById('connectionStatus').classList.add('connected');
                socket.emit('user-login', { username: currentUser });
            });
            socket.on('disconnect', () => {
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-wifi"></i> Disconnected';
                document.getElementById('connectionStatus').classList.remove('connected');
            });
            socket.on('user-online', d => { if (d.username === otherUser) updateUserStatus(true); });
            socket.on('user-offline', d => { if (d.username === otherUser) updateUserStatus(false); });
            socket.on('new-message', m => { if (m.sender === otherUser) addMessage('received', m.text, new Date(m.timestamp)); });
        }

        function updateUserStatus(o) {
            const t = o ? 'Online' : 'Offline', d = o ? 'block' : 'none';
            document.getElementById('userStatus').textContent = t;
            document.getElementById('chatContactStatus').textContent = t;
            document.getElementById('onlineIndicator').style.display = d;
            document.getElementById('chatOnlineIndicator').style.display = d;
        }

        function sendMessage() {
            const t = messageInput.value.trim();
            if (!t || !socket) return;
            const p = { text: t, sender: currentUser, receiver: otherUser, timestamp: Date.now() };
            socket.emit('send-message', p);
            addMessage('sent', t, new Date());
            messageInput.value = '';
        }

        function addMessage(type, text, time) {
            const div = document.createElement('div');
            div.className = `message message-${type}`;
            const ts = time.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            div.innerHTML = `<div>${text}</div><div class="message-time">${ts}</div>`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', e => e.key === 'Enter' && sendMessage());

        userProfilePic.addEventListener('click', () => fileInput.click());
        fileInput.onchange = e => {
            const f = e.target.files[0];
            if (f && f.type.startsWith('image/')) {
                const r = new FileReader();
                r.onload = ev => {
                    const img = `<img src="${ev.target.result}">`;
                    document.querySelectorAll('.profile-pic').forEach(p => p.innerHTML = img);
                    localStorage.setItem('profilePic', ev.target.result);
                };
                r.readAsDataURL(f);
            }
        };

        function loadProfilePictures() {
            const p = localStorage.getItem('profilePic');
            if (p) document.querySelectorAll('.profile-pic').forEach(el => el.innerHTML = `<img src="${p}">`);
        }

        voiceCallBtn.addEventListener('click', () => initiateCall('voice'));
        videoCallBtn.addEventListener('click', () => initiateCall('video'));

        // Paste your WebRTC functions here (initiateCall, createPeerConnection, etc.)
    </script>
</body>
</html>
